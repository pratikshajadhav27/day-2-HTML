<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2e - LinkedIn Buttons</title>
  <style>
    .linkedin-apply {
      background-color: rgb(10, 102, 194);
      color: white;
      font-weight: bold;
      height: 36px;
      width: 220px;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      margin-right: 8px;
    }

    .linkedin-save {
      background-color: white;
      color: rgb(10, 102, 194);
      font-weight: bold;
      height: 36px;
      width: 70px;
      border-style: solid;
      border-width: 1px;
      border-color: rgb(10, 102, 194);
      border-radius: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="linkedin-apply">Apply on company website</button>
  <button class="linkedin-save">Save</button>
</body>
</html>
