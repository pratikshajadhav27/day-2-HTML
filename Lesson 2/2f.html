<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2f - Amazon Product</title>
  <style>
    .back-link {
      color: rgb(0, 113, 133);
    }

    .product-title {
      font-weight: bold;
      font-size: 24px;
    }

    .product-price {
      color: rgb(0, 118, 0);
      font-weight: bold;
    }

    .add-to-cart-btn {
      background-color: rgb(255, 216, 20);
      color: black;
      height: 32px;
      width: 120px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      margin-right: 8px;
    }

    .buy-now-btn {
      background-color: rgb(255, 164, 28);
      color: black;
      height: 32px;
      width: 120px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <a class="back-link" href="#">Back to Amazon</a>

  <p class="product-title">Nike Black Running Shoes</p>

  <p class="product-price">$39 - in stock.</p>

  <p>Free delivery tomorrow.</p>

  <button class="add-to-cart-btn">Add to Cart</button>
  <button class="buy-now-btn">Buy now</button>
</body>
</html>
